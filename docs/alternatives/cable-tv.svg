<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <rect width="320" height="180" rx="16" fill="#1c1917" stroke="#292524" stroke-width="2"/>
  <!-- Satellite Dish & Set-Top Box -->
  <g transform="translate(120, 36)">
    <!-- Satellite dish arc -->
    <path d="M15,48 A28,28 0 0,1 65,12" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="60" y2="15" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="62" cy="14" r="4" fill="#fbbf24"/>
    <!-- Signal waves -->
    <path d="M68,6 A12,12 0 0,1 78,22" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <path d="M74,0 A20,20 0 0,1 86,26" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <!-- Set top box -->
    <rect x="0" y="58" width="80" height="20" rx="4" fill="#44403c" stroke="#78716c" stroke-width="1.5"/>
    <circle cx="12" cy="68" r="2.5" fill="#22c55e"/>
    <circle cx="20" cy="68" r="2.5" fill="#3b82f6"/>
    <line x1="50" y1="68" x2="72" y2="68" stroke="#78716c" stroke-width="2"/>
  </g>
  <text x="160" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#a8a29e" text-anchor="middle">Cable / DTH TV</text>
</svg>