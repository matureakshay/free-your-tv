<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="cobalt_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cobalt_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  
  <!-- Leanback Card Surface -->
  <rect width="320" height="180" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Cobalt Diamond & Play Symbol -->
  <g transform="translate(160, 75)">
    <!-- Outer Diamond (Cobalt Gem) -->
    <polygon points="0,-42 42,0 0,42 -42,0" fill="url(#cobalt_grad)"/>
    <!-- Top-left facet highlight -->
    <polygon points="0,-42 0,0 -42,0" fill="url(#cobalt_light)" opacity="0.6"/>
    <!-- Bottom-right facet shading -->
    <polygon points="0,42 42,0 0,0" fill="#0c4a6e" opacity="0.4"/>
    <!-- Play Triangle -->
    <polygon points="-8,-16 16,0 -8,16" fill="#ffffff"/>
  </g>
  
  <text x="160" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">TizenTube Cobalt</text>
</svg>